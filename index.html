<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Story Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one shell, three views (landing, parent portal, clinician portal). Light green and white, carried over from VAGUS. */
:root{
  --bg:#F5FBF8; --surface:#FFFFFF; --mint:#E2F5EB; --mint-2:#C6EBD9;
  --ink:#0A3340; --ink-2:#456A75; --line:#D3E7DD;
  --accent:#02C39A; --accent-ink:#023E4F; --teal:#027585;
  --amber-bg:#FFF4CC; --amber-fg:#6E5200; --rose-bg:#FCE8E3; --rose-fg:#A3341F;
  --shadow:0 1px 2px rgba(2,62,79,.06),0 8px 24px rgba(2,62,79,.07);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071E26; --surface:#0D2B35; --mint:#12383F; --mint-2:#1A4B50;
  --ink:#E6F6EF; --ink-2:#9CC0C4; --line:#1F4650;
  --accent:#02C39A; --accent-ink:#03262F; --teal:#4FD8C3;
  --amber-bg:#3A3210; --amber-fg:#F7DC6F; --rose-bg:#3A1E1A; --rose-fg:#F4A99A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071E26; --surface:#0D2B35; --mint:#12383F; --mint-2:#1A4B50;
  --ink:#E6F6EF; --ink-2:#9CC0C4; --line:#1F4650;
  --accent:#02C39A; --accent-ink:#03262F; --teal:#4FD8C3;
  --amber-bg:#3A3210; --amber-fg:#F7DC6F; --rose-bg:#3A1E1A; --rose-fg:#F4A99A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.2rem}
.brand small{font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--ink-2);display:block;line-height:1.1}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--mint);border-radius:999px;padding:3px;gap:2px}
.seg a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.9rem}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(2,62,79,.15)}
.demo-tag{font-size:.75rem;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;text-decoration:none;background:var(--accent);color:var(--accent-ink);min-height:44px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(2,195,154,.3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--teal);box-shadow:none}
.btn.soft{background:var(--mint);color:var(--ink)}
.btn.danger{background:var(--rose-bg);color:var(--rose-fg)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:10px}

/* chips, pills */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.92rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--mint-2);border-color:var(--teal);color:var(--ink);font-weight:700}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--mint);color:var(--ink);font-weight:500}
.tag.hit{background:var(--mint-2);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.requested{background:var(--amber-bg);color:var(--amber-fg)}
.pill.confirmed{background:var(--mint-2);color:var(--ink)}
.pill.completed{background:transparent;border:1.5px solid var(--teal);color:var(--teal)}
.pill.declined,.pill.cancelled{background:var(--rose-bg);color:var(--rose-fg)}
.pill.new{background:var(--accent);color:var(--accent-ink)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.eyebrow{font-size:.85rem;font-weight:600;color:var(--teal)}

/* landing */
.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.6rem);font-weight:700}
.hero .lede{font-size:1.15rem;color:var(--ink-2);max-width:34em;margin-top:20px}
.hero .cta{margin-top:28px}
.three{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.three-h{padding:14px 16px 6px;font-weight:700;font-family:var(--display)}
.voice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.voice:first-of-type{border-top:0}
.voice b{display:block;font-size:.85rem;color:var(--teal)}
.voice q{font-size:.98rem;quotes:none}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:.9rem}
.av.c{background:var(--mint-2)} .av.p{background:var(--amber-bg);color:var(--amber-fg)} .av.d{background:var(--accent);color:var(--accent-ink)}
.mkl{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--ink-2);min-width:52px;text-align:center}
section.block{padding-block:56px}
section.block.tint{background:var(--mint)}
.h2{font-size:clamp(1.7rem,3.6vw,2.5rem);max-width:20em}
.big{font-family:var(--display);font-weight:700;font-size:clamp(4rem,10vw,7rem);line-height:.9;color:var(--teal)}
.facts{display:grid;gap:14px}
.fact{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
.fact b{font-family:var(--display);font-size:1.8rem;min-width:4.2ch;color:var(--teal)}
.steps{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 18px 64px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:16px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.steps b{display:block;font-family:var(--display);font-size:1.05rem}
.ticks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.ticks li{padding-left:26px;position:relative}
.ticks li::before{content:"";position:absolute;left:2px;top:.5em;width:12px;height:7px;border-left:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg)}
footer.foot{padding-block:32px;border-top:1px solid var(--line);margin-top:32px}

/* portals */
.portal{padding-block:28px 56px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(1.7rem,3.4vw,2.4rem)}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.stepper button{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 16px 8px 8px;font-weight:600}
.stepper button .n{width:28px;height:28px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:.85rem}
.stepper button[aria-current="step"]{border-color:var(--teal);background:var(--mint)}
.stepper button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.stepper button.done .n{background:var(--mint-2)}
.stepper button[disabled]{opacity:.5;cursor:not-allowed}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-weight:700;font-size:.95rem}
.field .hint{font-size:.85rem;color:var(--ink-2)}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;width:100%}
textarea{min-height:92px;resize:vertical}
.form-sec{display:flex;flex-direction:column;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.form-sec:first-child{border-top:0;padding-top:0}
.drop{display:block;border:2px dashed var(--mint-2);background:var(--mint);border-radius:16px;padding:22px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--teal);background:var(--mint-2)}
.drop b{display:block;font-family:var(--display)}
.check{display:flex;gap:12px;align-items:flex-start}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.sb{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.pick{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow)}
.stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.story{display:flex;flex-direction:column;gap:12px}
.story.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.story h3{font-size:1.25rem}
.band{font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:999px}
.band.b3{background:var(--accent);color:var(--accent-ink)} .band.b2{background:var(--mint-2)} .band.b1{background:var(--mint);color:var(--ink-2)}
.umk{display:flex;gap:14px;flex-wrap:wrap}
details.more summary{cursor:pointer;font-weight:700;color:var(--teal);padding:4px 0}
details.more .inner{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.vq{border-left:3px solid var(--mint-2);padding-left:12px}
.vq b{font-size:.8rem;color:var(--teal);display:block}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.day{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;text-align:left;min-width:104px}
.day b{display:block;font-family:var(--display)}
.day span{font-size:.8rem;color:var(--ink-2)}
.day[aria-pressed="true"]{background:var(--mint-2);border-color:var(--teal)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:14px}
.slot{border:1.5px solid var(--mint-2);background:var(--mint);border-radius:12px;padding:12px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.slot small{display:block;font-weight:500;font-size:.72rem;color:var(--ink-2)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot[aria-pressed="true"] small{color:var(--accent-ink)}
.slot[disabled]{background:transparent;border-style:dashed;border-color:var(--line);color:var(--ink-2);cursor:not-allowed;font-weight:500;text-decoration:line-through}
.radio{display:flex;gap:8px}
.radio .chip{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* clinician */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 18px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tile b{font-family:var(--display);font-size:2.2rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:.88rem;color:var(--ink-2)}
.tile.hot{background:var(--amber-bg);border-color:transparent}
.tile.hot span{color:var(--amber-fg)}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.when{font-variant-numeric:tabular-nums;text-align:center;background:var(--mint);border-radius:12px;padding:6px 10px;min-width:74px}
.when b{display:block;font-family:var(--display)}
.when span{font-size:.78rem;color:var(--ink-2)}
.li .nm{font-weight:700}
.sched{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.agenda{display:flex;flex-direction:column;gap:8px}
.ag{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface)}
.ag time{font-weight:700;font-variant-numeric:tabular-nums}
.ag.open{background:var(--mint);border-color:var(--mint-2)}
.ag.closed{border-style:dashed;color:var(--ink-2);background:transparent}
.ag.booked{border-color:var(--teal)}
.fort{overflow-x:auto}
.fort table{border-collapse:separate;border-spacing:3px;font-size:.72rem;font-variant-numeric:tabular-nums}
.fort th{font-weight:600;color:var(--ink-2);padding:2px 4px;text-align:center;white-space:nowrap}
.fort td{padding:0}
.fort button.c{width:30px;height:26px;border-radius:6px;border:1px solid var(--mint-2);background:var(--mint);font-size:.7rem;font-weight:700;padding:0}
.fort button.c.b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fort button.c.x{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 6px);border-color:var(--line)}
.fort button.c.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend-k{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:10px}
.legend-k i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--mint);border:1px solid var(--mint-2)}
.legend-k i.b{background:var(--accent);border-color:var(--accent)} .legend-k i.x{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 5px);border-color:var(--line)}
.pat{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:20px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pi{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;width:100%}
.pi[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.pi.off{opacity:.6}
.doc h3{font-size:1.2rem;margin-bottom:8px}
.sum{display:flex;flex-direction:column;gap:18px}
.sum section{display:flex;flex-direction:column;gap:8px}
.sum ul{margin:0;padding-left:20px;display:grid;gap:4px}
.todo{display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.todo input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rate fieldset{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0;min-width:0}
.rate legend{font-weight:700;padding-inline:6px}
.rate button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:.88rem}
.rate button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint-2);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--ink-2)}
.auth-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:48px;align-items:center;padding-block:24px}
.auth-h{font-size:clamp(1.9rem,4vw,2.9rem)}
@media (max-width:900px){
  .auth-grid{grid-template-columns:minmax(0,1fr);gap:28px}
  .hero-grid,.two,.sched,.pat,.grid2,.stories{grid-template-columns:minmax(0,1fr)}
  .grid3,.steps{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rate{grid-template-columns:minmax(0,1fr)}
  .hero{padding-block:32px 24px}
}
@media (max-width:520px){.voice{grid-template-columns:auto minmax(0,1fr)}.voice .mkl{grid-column:2;flex-direction:row;justify-content:flex-start;gap:6px}.li{grid-template-columns:auto minmax(0,1fr)}.li>:last-child{grid-column:1/-1}.demo-tag{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- constants ---------- */
const KEY='storypilot.prototype.v1';
const NEEDS=['Autism','Language disorder (DLD)','Speech sound difficulty','Stammer','Selective mutism','Social communication difficulty','Non-speaking or uses AAC'];
const CONCERNS=['Anxiety','Low mood','School avoidance','Attention and focus','Anger or meltdowns','Sleep','Worries that repeat (OCD-type)','Friendships'];
const STYLES=['Takes words literally','Needs pictures or written steps','Needs extra time to answer','Nods along when unsure','Finds eye contact hard','Sensitive to noise or light','Prefers typing or drawing','Repeats words back'];
const GENDERS=['Girl','Boy','Non-binary','Prefer not to say'];
const TIMES=['09:30','10:15','11:00','11:45','13:30','14:15','15:00','15:45'];
const LV=['Not sure','Partly','Understood'];
const CLIN={name:'Dr Amira Rahman',role:'Consultant child and adolescent psychiatrist',site:'Children’s Communication Clinic (example NHS host)'};

const STORIES=[

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function nextWeekdays(n){const out=[];const d=new Date();d.setHours(0,0,0,0);while(out.length<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)out.push(iso(d))}return out}
const DAYS=nextWeekdays(10);
const fmtDay=s=>parseIso(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtLong=s=>parseIso(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const slotId=(d,t)=>d+'_'+t;
const slotLabel=id=>{const [d,t]=id.split('_');return fmtDay(d)+', '+t};

}

const LKEY='storypilot.local.v2';
function localAdapter(){
  let data=null;try{data=JSON.parse(localStorage.getItem(LKEY))}catch(e){}
  if(!data){data={};COLLS.forEach(c=>{data[c]={}});demoOps().forEach(o=>{data[o.c][o.id]=o.data})}
  const subs=[];const clone=x=>JSON.parse(JSON.stringify(x));
  const persist=()=>{try{localStorage.setItem(LKEY,JSON.stringify(data))}catch(e){}};
  const fire=()=>subs.forEach(s=>s.cb(clone(data[s.c]||{})));
  window.addEventListener('storage',ev=>{if(ev.key===LKEY&&ev.newValue){try{data=JSON.parse(ev.newValue);fire()}catch(e){}}});
  return{
    sub(c,cb){const s={c:c,cb:cb};subs.push(s);setTimeout(()=>cb(clone(data[c]||{})),0);return()=>{subs.splice(subs.indexOf(s),1)}},
    async set(c,id,v){data[c][id]=clone(v);persist();fire()},
    async del(c,id){delete data[c][id];persist();fire()},
    async claim(id,v){if(data.claims[id]&&data.claims[id].uid)return false;data.claims[id]=clone(v);persist();fire();return true}
  };
}
function dbAdapter(db){
  return{
    sub(c,cb,err){return db.collection(c).onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});cb(m)},e=>{if(err)err(e)})},
    async set(c,id,v){await db.collection(c).doc(id).set(v)},
    async del(c,id){await db.collection(c).doc(id).delete()},
    async claim(id,v){
      const r=db.collection('claims').doc(id);
      const l=await r.acquire({holder:String(store.uid||'viewer'),ttlMs:5000});
      if(!l.acquired)return false;
      const s=await r.get();
      if(s.exists&&s.data()&&s.data().uid)return false;
      await r.set(v);return true;
    }
  };
}
function apiAdapter(){
  let token='';try{token=localStorage.getItem('storypilot.token')||''}catch(e){}
  let es=null;const subs=[];const cache={};
  const setToken=t=>{token=t||'';try{if(t)localStorage.setItem('storypilot.token',t);else localStorage.removeItem('storypilot.token')}catch(e){}};
  function connect(){
    if(es)es.close();
    es=new EventSource('/api/events?token='+encodeURIComponent(token));
    es.onmessage=ev=>{try{const st=JSON.parse(ev.data);COLLS.forEach(c=>{cache[c]=st[c]||{}});subs.forEach(s=>s.cb(cache[s.c]||{}))}catch(x){}};
  }
  async function call(method,url,body){
    const r=await fetch(url,{method:method,headers:{'content-type':'application/json','x-token':token},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json()}catch(x){}
    if(!r.ok){const er=new Error(j.error||('Request failed ('+r.status+')'));er.status=r.status;er.code=r.status===403?'invalid_argument':'unavailable';throw er}
    return j;
  }
  return{
    sub(c,cb){const s={c:c,cb:cb};subs.push(s);if(!es)connect();if(cache[c])setTimeout(()=>cb(cache[c]),0);return()=>{const i=subs.indexOf(s);if(i>-1)subs.splice(i,1)}},
    async set(c,id,v){await call('PUT','/api/doc/'+c+'/'+encodeURIComponent(id),v)},
    async del(c,id){await call('DELETE','/api/doc/'+c+'/'+encodeURIComponent(id))},
    async claim(id,v){try{await call('POST','/api/claim/'+encodeURIComponent(id),v);return true}catch(e){if(e.status===409)return false;throw e}},
    async me(){if(!token)return null;try{return (await call('GET','/api/me')).user}catch(e){setToken('');return null}},
    async signup(p){const r=await call('POST','/api/signup',p);setToken(r.token);return r.user},
    async login(p){const r=await call('POST','/api/login',p);setToken(r.token);return r.user},
    async logout(){try{await call('POST','/api/logout')}catch(e){}setToken('');if(es){es.close();es=null}Object.keys(cache).forEach(k=>{delete cache[k]})}
  };
}
let apiA=null;
async function initStore(){
  let adapter=null;
  try{
    if(window.claude&&window.claude.use){
      const db=await window.claude.use('db');
      const user=await window.claude.use('user');
      if(db&&user){
        const id=await user.id();
        store.admin=await user.canEdit();
        const cw=await user.can('data.write');
        store.uid=id;store.canWrite=!!id&&cw!==false;store.mode='shared';
        adapter=dbAdapter(db);
      }
    }
  }catch(e){adapter=null}
  if(!adapter&&/^https?:$/.test(location.protocol)){
    try{const r=await fetch('/api/ping');
      if(r.ok){apiA=apiAdapter();adapter=apiA;store.mode='api'}}catch(e){apiA=null;adapter=null}
  }
  if(!adapter){adapter=localAdapter();store.mode='local';store.uid='me';store.admin=true;store.canWrite=true}
  store.sub=adapter.sub;store.set=adapter.set;store.del=adapter.del;store.claim=adapter.claim;
  if(store.mode==='api')setUser(await apiA.me());
  if(store.mode!=='api'||store.user)startSubs();
  store.ready=true;
}
let unsubs=[];
function startSubs(){
  stopSubs();
  COLLS.forEach(c=>{
    if(c==='clinical'&&store.mode==='shared'&&!store.admin)return;
    unsubs.push(store.sub(c,m=>{D[c]=m;scheduleUpdate()},e=>{if(e&&e.code==='revoked')toast('Access to the live data was withdrawn.')}));
  });
}
function stopSubs(){unsubs.forEach(u=>{try{u()}catch(x){}});unsubs=[];COLLS.forEach(c=>{D[c]={}});rebuild()}
function setUser(u){store.user=u;store.uid=u?u.id:null;store.admin=!!u&&u.role==='clinician';store.canWrite=!!u;if(u&&!ui.draft.parentName&&u.role==='parent')ui.draft.parentName=u.name}

function match(st,c){
  const age=Number(c.age);const sh={needs:st.needs.filter(x=>c.needs.includes(x)),concerns:st.concerns.filter(x=>c.concerns.includes(x)),styles:st.styles.filter(x=>c.styles.includes(x))};
  let max=3*c.needs.length+2*c.concerns.length+2*c.styles.length+3,got=3*sh.needs.length+2*sh.concerns.length+2*sh.styles.length;
  const inRange=age>=st.ages[0]&&age<=st.ages[1];const near=!inRange&&(age>=st.ages[0]-1&&age<=st.ages[1]+1);
  got+=inRange?3:near?1.5:0;
  const r=max?got/max:0;
  return {r,band:r>=.55?3:r>=.3?2:1,shared:sh,inRange,near};
}

  A[t.dataset.act](t,ev)});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='authform')A.auth();else A.saveProfile(null,ev)});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset&&t.dataset.auth){ui.auth.vals[t.dataset.auth]=t.value;return}const f=t.dataset&&t.dataset.field;if(!f)return;
  if(f==='search'){ui.search=t.value;const p=document.getElementById('plist');if(p)p.innerHTML=plistHTML();return}
  if(f==='note'){ui.note=t.value;return}
  ui.draft[f]=t.type==='checkbox'?t.checked:t.value});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.field==='age'||t.dataset.field==='consent'||t.dataset.field==='assent'){ui.draft[t.dataset.field]=t.type==='checkbox'?t.checked:t.value;return}
  const c=t.dataset.actChange;if(c&&C[c])C[c](t)});
document.addEventListener('dragover',ev=>{const z=ev.target.closest&&ev.target.closest('#dz');if(z){ev.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',ev=>{const z=ev.target.closest&&ev.target.closest('#dz');if(z)z.classList.remove('over')});
document.addEventListener('drop',ev=>{const z=ev.target.closest&&ev.target.closest('#dz');if(!z)return;ev.preventDefault();z.classList.remove('over');const f=ev.dataTransfer.files&&ev.dataTransfer.files[0];if(f)readFile(f)});

/* ---------- profile upload ---------- */
const KW={
  needs:[['Autism',/autis|\basd\b/],['Language disorder (DLD)',/\bdld\b|language disorder|developmental language/],['Speech sound difficulty',/speech sound|articulation/],['Stammer',/stammer|stutter/],['Selective mutism',/selective mutism/],['Social communication difficulty',/social communication/],['Non-speaking or uses AAC',/\baac\b|non-?speaking|non-?verbal/]],
  concerns:[['Anxiety',/anxi/],['Low mood',/low mood|depress/],['School avoidance',/school (avoid|refus)|emotionally based school/],['Attention and focus',/adhd|attention|focus/],['Anger or meltdowns',/meltdown|anger|angry/],['Sleep',/sleep/],['Worries that repeat (OCD-type)',/\bocd\b|obsess|compuls/],['Friendships',/friend|bully/]],
  styles:[['Takes words literally',/literal/],['Needs pictures or written steps',/visual|picture|written/],['Needs extra time to answer',/extra time|processing/],['Nods along when unsure',/nods|nodd/],['Finds eye contact hard',/eye contact/],['Sensitive to noise or light',/sensory|noise|bright light/],['Prefers typing or drawing',/typing|draw/],['Repeats words back',/echolal|repeats/]]};
function readFile(f){
  const d=ui.draft;
  if(/\.(txt|md|json|csv)$/i.test(f.name)||(f.type||'').startsWith('text/')||f.type==='application/json'){
    const r=new FileReader();
    r.onload=()=>{const text=String(r.result).slice(0,20000);const low=text.toLowerCase();let n=0;
      ['needs','concerns','styles'].forEach(k=>KW[k].forEach(([lab,re])=>{if(re.test(low)&&!d[k].includes(lab)){d[k].push(lab);n++}}));
      const am=low.match(/\bage[d]?\s*[:=]?\s*"?(\d{1,2})\b/)||low.match(/(\d{1,2})[\s-]*(?:years?[\s-]*old|yo\b)/);if(am&&am[1]>=5&&am[1]<=17){d.age=am[1];n++}
      const gm=low.match(/\b(girl|boy|non-binary)\b/);if(gm){d.gender=gm[1]==='girl'?'Girl':gm[1]==='boy'?'Boy':'Non-binary';n++}
      const nm=text.match(/name["']?\s*[:=]\s*["']?([A-Za-z]{2,20})/i);if(nm&&!d.name){d.name=nm[1];n++}
      d.file={name:f.name,msg:n?'Read '+n+' details into the form. Please check them.':'Read, but no recognisable details found. Fill the form by hand.'};
      render();toast(n?'Profile read. Check the details.':'No details recognised')};
    r.onerror=()=>{d.file={name:f.name,msg:'Could not read this file.'};render()};
    r.readAsText(f);
  }else{d.file={name:f.name,msg:'Attached for the clinician. This prototype cannot read this file type, so fill the form by hand.'};render();toast('File attached')}
}

/* ---------- live updates ---------- */
let known=new Set(),primed=false,upT=0;
function isTyping(){const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='file'}
function scheduleUpdate(){
  if(upT)return;
  upT=requestAnimationFrame(()=>{upT=0;rebuild();
    const ids=new Set(BK.filter(b=>b.status==='requested').map(b=>b.id));
    if(primed&&store.admin)ids.forEach(id=>{if(!known.has(id))toast('New booking request from a family')});
    known=ids;
    if(!ui.touched&&ui.view==='parent'&&myBookings().length)ui.pStep=4;
    if(isTyping()){ui.dirty=true;return}
    render();
  });
}
document.addEventListener('focusout',()=>{if(ui.dirty){ui.dirty=false;setTimeout(()=>{if(!isTyping())render()},0)}});
window.addEventListener('hashchange',route);
route();
initStore().then(()=>{setTimeout(()=>{primed=true},2500);render()});

})();
</script>
